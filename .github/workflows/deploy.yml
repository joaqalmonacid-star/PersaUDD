name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar sitio estático
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp auth.html site/auth.html
          cp perfil.html site/perfil.html
          cp soporte.html site/soporte.html
          cp producto.html site/producto.html
          cp publicar.html site/publicar.html
          cp admin.html site/admin.html
          cp product-form.js site/product-form.js
          cp auth-config.js site/auth-config.js
          cp -r images site/images
          touch site/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
