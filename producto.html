<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detalle del producto y contacto con el vendedor en OllaComun.">
    <title>OllaComun · Detalle del producto</title>
    <link rel="icon" type="image/png" href="images/meco_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #ffffff; --navy: #00295b; --ink: #000027; --red: #ed1c24;
            --green: #005f02; --cyan: #29abe2; --yellow: #fcee21;
            --surface: var(--white); --text-muted: rgba(0, 41, 91, 0.72);
            --border: rgba(0, 41, 91, 0.16); --emerald-soft: rgba(0, 95, 2, 0.10);
            --radius-lg: 16px; --radius-md: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            min-height: 100vh; color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased;
            background-color: var(--white);
            background-image:
                radial-gradient(ellipse 70% 45% at 6% 0%, rgba(41,171,226,0.22) 0%, rgba(41,171,226,0) 100%),
                radial-gradient(ellipse 60% 40% at 100% 10%, rgba(0,41,91,0.12) 0%, rgba(0,41,91,0) 100%),
                radial-gradient(ellipse 50% 35% at 50% 100%, rgba(0,95,2,0.07) 0%, rgba(0,95,2,0) 100%);
            background-attachment: fixed;
        }
        .container { width: 100%; max-width: 1080px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

        /* Navbar */
        nav { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 2rem; }
        .logo { font-weight: 800; font-size: 1.35rem; letter-spacing: -0.03em; display: flex; align-items: center; gap: 0.6rem; color: var(--navy); text-decoration: none; }
        .logo-img { width: 46px; height: 46px; object-fit: contain; }
        .nav-right { display: flex; align-items: center; justify-content: flex-end; gap: 0.75rem; flex-wrap: wrap; }
        .back-link { color: var(--navy); text-decoration: none; font-weight: 700; font-size: 0.9rem; white-space: nowrap; }
        .back-link:hover { color: var(--red); }
        .auth-buttons { display: flex; gap: 0.5rem; }
        .btn-nav { display: inline-flex; align-items: center; justify-content: center; padding: 0.55rem 1rem; border-radius: 999px; font-size: 0.85rem; font-weight: 700; text-decoration: none; white-space: nowrap; }
        .btn-login { color: var(--navy); border: 1.5px solid var(--navy); background: transparent; }
        .btn-login:hover { background: var(--navy); color: white; }
        .btn-signup { color: white; border: 1.5px solid var(--navy); background: var(--navy); }
        .btn-signup:hover { background: var(--red); border-color: var(--red); }
        .user-dropdown { position: relative; }
        .user-name-btn { display: flex; align-items: center; gap: 0.55rem; padding: 0.35rem 0.75rem 0.35rem 0.35rem; background: var(--surface); border: 1.5px solid var(--border); border-radius: 999px; cursor: pointer; color: var(--navy); font-weight: 700; font-size: 0.88rem; }
        .user-name-btn:hover { border-color: var(--navy); }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--navy); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; }
        #user-name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .caret { font-size: 0.7rem; }
        .dropdown-content { display: none; position: absolute; right: 0; top: calc(100% + 0.5rem); min-width: 190px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: 0 18px 36px -12px rgba(0,41,91,0.25); overflow: hidden; z-index: 30; }
        .user-dropdown.open .dropdown-content { display: block; }
        .dropdown-content a, .dropdown-content button { display: block; width: 100%; text-align: left; padding: 0.8rem 1rem; background: none; border: none; font-size: 0.9rem; font-weight: 700; color: var(--ink); text-decoration: none; cursor: pointer; }
        .dropdown-content a:hover, .dropdown-content button:hover { background: rgba(41,171,226,0.10); color: var(--navy); }
        .dropdown-content button { color: var(--red); border-top: 1px solid var(--border); }

        /* Detalle */
        #detail-status { min-height: 1.2em; margin-bottom: 0.75rem; font-size: 0.9rem; font-weight: 700; color: var(--red); }
        #detail-status.ok { color: var(--green); }
        .detail-card {
            display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 2rem;
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 1.5rem; box-shadow: 0 20px 40px -14px rgba(0,41,91,0.18);
        }
        .detail-image { width: 100%; height: 430px; object-fit: cover; border-radius: var(--radius-md); background: linear-gradient(135deg, rgba(41,171,226,0.18), var(--white)); border: 1px solid var(--border); }
        .detail-thumbs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }
        .detail-thumb { width: 62px; height: 62px; object-fit: cover; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
        .detail-thumb.active, .detail-thumb:hover { border-color: var(--cyan); }
        .product-cat { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--red); }
        .detail-info h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; margin: 0.5rem 0 0.8rem; }
        .detail-desc { font-size: 0.98rem; color: var(--text-muted); margin-bottom: 1rem; }
        .price-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 1rem 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
        .detail-price { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em; }
        .status-badge { font-size: 0.72rem; font-weight: 700; padding: 0.3rem 0.7rem; border-radius: 999px; }
        .status-disponible { background: var(--emerald-soft); color: var(--green); }
        .status-reservado { background: rgba(252,238,33,0.45); color: var(--navy); }
        .status-vendido { background: rgba(0,41,91,0.08); color: var(--navy); }
        .status-no_disponible { background: rgba(237,28,36,0.10); color: var(--red); }
        .detail-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.35rem; }
        .seller-box { margin: 1.25rem 0; padding: 1rem 1.1rem; border: 1px solid var(--border); border-left: 4px solid var(--cyan); border-radius: var(--radius-md); background: rgba(41,171,226,0.05); }
        .seller-box h3 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--red); margin-bottom: 0.5rem; }
        .seller-name { font-size: 1.05rem; font-weight: 800; }
        .seller-career { font-size: 0.88rem; color: var(--navy); font-weight: 600; }
        .privacy-note { font-size: 0.76rem; color: var(--text-muted); margin-top: 0.55rem; }
        .btn-contact { width: 100%; padding: 1rem; border: none; border-radius: var(--radius-md); background: var(--navy); color: white; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.15s ease; }
        .btn-contact:hover { background: var(--red); }
        .btn-contact:disabled { opacity: 0.65; cursor: wait; }
        .message { min-height: 1.3em; margin-top: 0.75rem; font-size: 0.86rem; font-weight: 700; }
        .message.ok { color: var(--green); }
        .message.error { color: var(--red); }
        .empty { color: var(--text-muted); font-size: 0.95rem; }
        footer { text-align: center; margin-top: 3rem; font-size: 0.8rem; color: var(--text-muted); }

        @media (max-width: 800px) {
            .detail-card { grid-template-columns: 1fr; gap: 1.25rem; }
            .detail-image { height: 300px; }
        }
        @media (max-width: 560px) {
            .container { padding: 1.25rem 1rem 3rem; }
            nav { align-items: flex-start; flex-wrap: wrap; }
            .nav-right { width: 100%; justify-content: flex-start; }
            .logo { font-size: 1.2rem; }
            .logo-img { width: 38px; height: 38px; }
            .detail-card { padding: 1rem; }
            .detail-image { height: 240px; }
            .detail-price { font-size: 1.5rem; }
            #user-name { max-width: 110px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a class="logo" href="index.html"><img src="images/meco_logo.png" alt="Logo OllaComun" class="logo-img"> OllaComun</a>
            <div class="nav-right">
                <a class="back-link" href="index.html">← Volver al mercado</a>
                <div id="auth-buttons" class="auth-buttons">
                    <a class="btn-nav btn-login" href="auth.html?mode=login">Iniciar sesión</a>
                    <a class="btn-nav btn-signup" href="auth.html?mode=register">Registrarse</a>
                </div>
                <div id="user-menu" class="user-dropdown" style="display:none">
                    <button type="button" id="user-name-btn" class="user-name-btn">
                        <span class="user-avatar" id="user-avatar"></span>
                        <span id="user-name"></span>
                        <span class="caret">▾</span>
                    </button>
                    <div id="user-dropdown" class="dropdown-content">
                        <a href="perfil.html">Perfil</a>
                        <a href="soporte.html">Soporte</a>
                        <a href="admin.html" id="admin-link" style="display:none">Panel de administrador</a>
                        <button type="button" id="logout-btn">Cerrar sesión</button>
                    </div>
                </div>
            </div>
        </nav>

        <div id="detail-status" role="status" aria-live="polite"></div>
        <main id="detail-content" class="detail-card">
            <p class="empty">Cargando producto...</p>
        </main>

        <footer>OllaComun · Piloto Fin de Semestre · UDD · Sin pagos en la app · 0% comisión</footer>
    </div>

    <script src="auth-config.js"></script>
    <script src="product-form.js"></script>
    <script>
        const API = String(window.AUTH_API_URL || '').replace(/\/$/, '');
        const token = localStorage.getItem('authToken');
        const productId = new URLSearchParams(location.search).get('id') || '';
        const statusBox = document.getElementById('detail-status');
        const content = document.getElementById('detail-content');

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
        }

        function setStatus(text, kind) {
            statusBox.textContent = text;
            statusBox.className = kind || '';
        }

        function syncAuthUI() {
            let user = null;
            try { user = JSON.parse(localStorage.getItem('authUser') || 'null'); } catch (e) { user = null; }
            const authButtons = document.getElementById('auth-buttons');
            const userMenu = document.getElementById('user-menu');
            if (token && user) {
                authButtons.style.display = 'none';
                userMenu.style.display = 'block';
                const label = [user.name, user.apellido].filter(Boolean).join(' ') || user.email || 'Usuario';
                document.getElementById('user-name').textContent = label;
                document.getElementById('user-avatar').textContent = (user.name || user.email || '?').charAt(0).toUpperCase();
                const adminLink = document.getElementById('admin-link');
                if (adminLink) {
                    adminLink.style.display = (user.isAdmin || String(user.email || '').toLowerCase() === 'joaq.almonacid@gmail.com') ? 'block' : 'none';
                }
            } else {
                authButtons.style.display = 'flex';
                userMenu.style.display = 'none';
            }
        }

        const dropdown = document.getElementById('user-menu');
        document.getElementById('user-name-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('open');
        });
        document.addEventListener('click', () => dropdown.classList.remove('open'));
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('authToken');
            localStorage.removeItem('authUser');
            location.reload();
        });

        function renderProduct(p) {
            const seller = p.seller || {};
            const labels = { disponible: '● Disponible', reservado: '◐ Reservado', vendido: '✓ Vendido', no_disponible: '✕ No disponible' };
            const status = p.status || 'disponible';
            const gallery = window.OllaProductForm.imageSrc(p);
            const extra = (p.images || []).slice(1);

            content.innerHTML = `
                <div class="detail-media">
                    <img id="detail-main-image" class="detail-image" src="${escapeHtml(gallery)}" alt="${escapeHtml(p.name)}">
                    <div class="detail-thumbs">
                        ${[gallery].concat(extra).map((src, i) => `<img class="detail-thumb ${i === 0 ? 'active' : ''}" src="${escapeHtml(src)}" alt="Foto ${i + 1}" data-src="${escapeHtml(src)}">`).join('')}
                    </div>
                </div>
                <div class="detail-info">
                    <span class="product-cat">${escapeHtml(p.carrera)} · ${escapeHtml(p.tipo)} · ${escapeHtml(p.funcionalidad)}</span>
                    <h1>${escapeHtml(p.name)}</h1>
                    <p class="detail-desc">${escapeHtml(p.description)}</p>
                    <div class="price-row">
                        <span class="detail-price">$${Number(p.price).toLocaleString('es-CL')}</span>
                        <span class="status-badge status-${escapeHtml(status)}">${escapeHtml(labels[status] || status)}</span>
                    </div>
                    <p class="detail-meta">📍 Entrega en: ${escapeHtml(p.place)}</p>
                    <p class="detail-meta">Publicado el ${new Date(p.createdAt).toLocaleDateString('es-CL')}</p>

                    <div class="seller-box">
                        <h3>Vendido por</h3>
                        <p class="seller-name">${escapeHtml(seller.name || 'Vendedor OllaComun')}</p>
                        <p class="seller-career">Carrera: ${escapeHtml(seller.carrera || 'Comunidad UDD')}</p>
                        <p class="privacy-note">Por privacidad no mostramos correo ni teléfono del vendedor.</p>
                    </div>

                    <button type="button" id="contact-btn" class="btn-contact">Contactar</button>
                    <div id="contact-status" class="message" role="status" aria-live="polite"></div>
                    <p class="privacy-note">Al contactar, el vendedor recibirá tu nombre, apellido, carrera y teléfono registrados en tu perfil.</p>
                </div>`;

            content.querySelectorAll('.detail-thumb').forEach(thumb => {
                thumb.addEventListener('click', () => {
                    document.getElementById('detail-main-image').src = thumb.dataset.src;
                    content.querySelectorAll('.detail-thumb').forEach(t => t.classList.remove('active'));
                    thumb.classList.add('active');
                });
            });
            document.getElementById('contact-btn').addEventListener('click', contactSeller);
        }

        async function contactSeller() {
            const button = document.getElementById('contact-btn');
            const message = document.getElementById('contact-status');

            if (!token) {
                location.href = 'auth.html?mode=login';
                return;
            }

            button.disabled = true;
            button.textContent = 'Enviando...';
            message.textContent = '';
            message.className = 'message';

            try {
                const response = await fetch(API + '/api/products/' + encodeURIComponent(productId) + '/contact', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || 'No se pudo enviar el correo');

                button.textContent = 'Correo enviado ✓';
                message.textContent = data.message || 'Correo enviado al vendedor.';
                message.className = 'message ok';
            } catch (err) {
                button.disabled = false;
                button.textContent = 'Contactar';
                message.textContent = err.message;
                message.className = 'message error';
            }
        }

        async function loadProduct() {
            if (!productId) {
                setStatus('No se indicó qué producto ver. Vuelve al mercado.', 'error');
                content.innerHTML = '<p class="empty">Producto no encontrado.</p>';
                return;
            }
            try {
                const response = await fetch(API + '/api/products/' + encodeURIComponent(productId));
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || 'No se pudo cargar el producto');
                renderProduct(data.product);
            } catch (err) {
                setStatus(err.message, 'error');
                content.innerHTML = '<p class="empty">No se pudo cargar este producto.</p>';
            }
        }

        syncAuthUI();
        loadProduct();
    </script>
</body>
</html>
