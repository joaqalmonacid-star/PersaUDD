<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Publica o edita un producto en OllaComun.">
    <title>OllaComun · Publicar producto</title>
    <link rel="icon" type="image/png" href="images/meco_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #ffffff; --navy: #00295b; --ink: #000027; --red: #ed1c24;
            --green: #005f02; --cyan: #29abe2; --yellow: #fcee21;
            --surface: var(--white); --text-muted: rgba(0, 41, 91, 0.72);
            --border: rgba(0, 41, 91, 0.16); --radius-lg: 16px; --radius-md: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            min-height: 100vh; color: var(--ink); line-height: 1.55; -webkit-font-smoothing: antialiased;
            background-color: var(--white);
            background-image:
                radial-gradient(ellipse 70% 45% at 6% 0%, rgba(41,171,226,0.22) 0%, rgba(41,171,226,0) 100%),
                radial-gradient(ellipse 60% 40% at 100% 10%, rgba(0,41,91,0.12) 0%, rgba(0,41,91,0) 100%),
                radial-gradient(ellipse 50% 35% at 50% 100%, rgba(0,95,2,0.07) 0%, rgba(0,95,2,0) 100%);
            background-attachment: fixed;
        }
        .container { width: 100%; max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
        nav { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 2rem; }
        .logo { font-weight: 800; font-size: 1.35rem; letter-spacing: -0.03em; display: flex; align-items: center; gap: 0.6rem; color: var(--navy); text-decoration: none; }
        .logo-img { width: 46px; height: 46px; object-fit: contain; }
        .nav-right { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; justify-content: flex-end; }
        .back-link { color: var(--navy); text-decoration: none; font-weight: 700; font-size: 0.9rem; white-space: nowrap; }
        .back-link:hover { color: var(--red); }
        h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.3rem; }
        .sub { color: var(--text-muted); margin-bottom: 1.75rem; font-size: 0.95rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.75rem; box-shadow: 0 20px 40px -14px rgba(0,41,91,0.18); }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem; }
        .field { display: flex; flex-direction: column; gap: 0.45rem; }
        .field.full { grid-column: 1 / -1; }
        label.field-label { font-size: 0.88rem; font-weight: 700; }
        input, select, textarea {
            width: 100%; padding: 0.85rem 1rem; border: 1.5px solid var(--border); border-radius: var(--radius-md);
            font-size: 1rem; color: var(--ink); background: var(--surface); font-family: inherit;
        }
        textarea { min-height: 110px; resize: vertical; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(41,171,226,0.22); }
        input[type="file"] { padding: 0.7rem; font-size: 0.9rem; }
        .hint { font-size: 0.76rem; color: var(--text-muted); }
        .previews { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.6rem; margin-top: 0.5rem; }
        .preview { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: rgba(41,171,226,0.10); }
        .preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .preview button { position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; border: none; border-radius: 50%; background: rgba(0,0,0,0.65); color: white; font-weight: 800; cursor: pointer; line-height: 1; }
        .btn { padding: 0.95rem 1.4rem; background: var(--navy); color: white; border: none; border-radius: var(--radius-md); font-size: 1rem; font-weight: 700; cursor: pointer; }
        .btn:hover { background: var(--red); }
        .btn:disabled { opacity: 0.6; cursor: wait; }
        .message { min-height: 1.3em; margin-top: 1rem; font-size: 0.88rem; font-weight: 700; }
        .message.ok { color: var(--green); } .message.error { color: var(--red); }
        @media (max-width: 640px) {
            .container { padding: 1.25rem 1rem 3rem; }
            nav { flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1.5rem; }
            .logo { font-size: 1.2rem; }
            .logo-img { width: 38px; height: 38px; }
            .card { padding: 1.15rem; }
            form { grid-template-columns: 1fr; }
            .previews { grid-template-columns: repeat(3, 1fr); }
            input, select, textarea { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a class="logo" href="index.html"><img src="images/meco_logo.png" alt="Logo OllaComun" class="logo-img"> OllaComun</a>
            <div class="nav-right"><a class="back-link" href="perfil.html">← Volver a mi perfil</a></div>
        </nav>

        <h1 id="page-title">Publicar producto</h1>
        <p class="sub" id="page-sub">Completa los datos y sube hasta 5 fotos desde tu dispositivo.</p>

        <div class="card">
            <form id="product-form">
                <div class="field full"><label class="field-label" for="f-name">Nombre del producto</label><input type="text" id="f-name" minlength="3" required></div>
                <div class="field full"><label class="field-label" for="f-description">Descripción</label><textarea id="f-description" minlength="10" required></textarea></div>
                <div><label class="field-label" for="f-price">Precio (CLP)</label><input type="number" id="f-price" min="0" required></div>
                <div><label class="field-label" for="f-place">Lugar de entrega</label><input type="text" id="f-place" minlength="3" required></div>
                <div><label class="field-label" for="f-carrera">Carrera</label><select id="f-carrera" required></select></div>
                <div><label class="field-label" for="f-tipo">Tipo de producto</label><select id="f-tipo" required></select></div>
                <div><label class="field-label" for="f-funcionalidad">Funcionalidad</label><select id="f-funcionalidad" required></select></div>
                <div id="status-field" class="field" style="display:none"><label class="field-label" for="f-status">Estado</label>
                    <select id="f-status">
                        <option value="disponible">Disponible</option>
                        <option value="reservado">Reservado</option>
                        <option value="vendido">Vendido</option>
                        <option value="no_disponible">No disponible</option>
                    </select>
                </div>
                <div class="field full">
                    <label class="field-label" for="f-files">Fotos del producto</label>
                    <input type="file" id="f-files" accept="image/*" multiple>
                    <span class="hint">Hasta 5 fotos JPG, PNG o WebP. Se optimizan automáticamente.</span>
                    <div id="previews" class="previews"></div>
                </div>
                <div class="field full"><button type="submit" class="btn" id="submit-btn">Publicar producto</button></div>
            </form>
            <div id="message" class="message" role="status" aria-live="polite"></div>
        </div>
    </div>

    <script src="auth-config.js"></script>
    <script src="product-form.js"></script>
    <script>
        const API = String(window.AUTH_API_URL || '').replace(/\/$/, '');
        const token = localStorage.getItem('authToken');
        const editId = new URLSearchParams(location.search).get('edit') || '';
        const message = document.getElementById('message');
        const fileInput = document.getElementById('f-files');
        const previews = document.getElementById('previews');
        let images = [];

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
        }

        function showMessage(text, kind) {
            message.textContent = text;
            message.className = 'message ' + (kind || '');
        }

        if (!token) location.href = 'auth.html?mode=login';

        function fillSelect(id, values, selected) {
            document.getElementById(id).innerHTML = values.map(v =>
                `<option value="${escapeHtml(v)}" ${v === selected ? 'selected' : ''}>${escapeHtml(v)}</option>`
            ).join('');
        }

        function renderPreviews() {
            previews.innerHTML = images.map((src, index) => `
                <div class="preview">
                    <img src="${escapeHtml(src)}" alt="Foto ${index + 1}">
                    <button type="button" data-index="${index}" aria-label="Quitar foto">×</button>
                </div>`).join('');
            previews.querySelectorAll('button').forEach(button => {
                button.addEventListener('click', () => {
                    images.splice(Number(button.dataset.index), 1);
                    renderPreviews();
                });
            });
        }

        fileInput.addEventListener('change', async () => {
            try {
                images = await window.OllaProductForm.filesToImages(fileInput.files, images);
                fileInput.value = '';
                renderPreviews();
                showMessage('', '');
            } catch (err) {
                showMessage(err.message, 'error');
                fileInput.value = '';
            }
        });

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const button = document.getElementById('submit-btn');
            if (!images.length) {
                showMessage('Sube al menos una foto del producto.', 'error');
                return;
            }
            button.disabled = true;
            button.textContent = 'Guardando...';
            showMessage('', '');

            const payload = {
                name: document.getElementById('f-name').value.trim(),
                description: document.getElementById('f-description').value.trim(),
                price: Number(document.getElementById('f-price').value),
                place: document.getElementById('f-place').value.trim(),
                carrera: document.getElementById('f-carrera').value,
                tipo: document.getElementById('f-tipo').value,
                funcionalidad: document.getElementById('f-funcionalidad').value,
                images
            };
            if (editId) payload.status = document.getElementById('f-status').value;

            try {
                const response = await fetch(API + (editId ? '/api/products/' + encodeURIComponent(editId) : '/api/products'), {
                    method: editId ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify(payload)
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || 'No se pudo guardar el producto');
                location.href = 'perfil.html?msg=' + encodeURIComponent(editId ? 'Producto actualizado correctamente.' : 'Producto publicado correctamente.');
            } catch (err) {
                showMessage(err.message, 'error');
                button.disabled = false;
                button.textContent = editId ? 'Guardar cambios' : 'Publicar producto';
            }
        });

        async function init() {
            try {
                const res = await fetch(API + '/api/categories');
                const cats = await res.json();
                fillSelect('f-carrera', cats.carreras);
                fillSelect('f-tipo', cats.tipos);
                fillSelect('f-funcionalidad', cats.funcionalidades);
            } catch (err) {
                showMessage('No se pudieron cargar las categorías.', 'error');
            }

            if (!editId) return;
            document.getElementById('page-title').textContent = 'Editar producto';
            document.getElementById('page-sub').textContent = 'Modifica los datos y guarda los cambios.';
            document.getElementById('status-field').style.display = 'flex';
            document.getElementById('submit-btn').textContent = 'Guardar cambios';

            try {
                const res = await fetch(API + '/api/products/' + encodeURIComponent(editId));
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'No se pudo cargar el producto');
                const p = data.product;
                document.getElementById('f-name').value = p.name || '';
                document.getElementById('f-description').value = p.description || '';
                document.getElementById('f-price').value = p.price || 0;
                document.getElementById('f-place').value = p.place || '';
                document.getElementById('f-carrera').value = p.carrera || '';
                document.getElementById('f-tipo').value = p.tipo || '';
                document.getElementById('f-funcionalidad').value = p.funcionalidad || '';
                document.getElementById('f-status').value = p.status || 'disponible';

                if (Array.isArray(p.images) && p.images.length) {
                    images = p.images.slice();
                } else if (p.image) {
                    try {
                        const blob = await fetch('images/' + p.image).then(r => r.blob());
                        images = [await window.OllaProductForm.fileToDataUrl(
                            new File([blob], p.image, { type: blob.type || 'image/jpeg' })
                        )];
                    } catch (err) {
                        images = [];
                    }
                }
                renderPreviews();
            } catch (err) {
                showMessage(err.message, 'error');
            }
        }

        init();
    </script>
</body>
</html>
