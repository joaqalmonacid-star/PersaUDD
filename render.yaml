services:
  - type: web
    name: ollacomun-auth
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: administracionollacomun@gmail.com
      - key: BREVO_SENDER_NAME
        value: OllaComun
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ollacomun
